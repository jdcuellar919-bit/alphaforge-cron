name: Keep backend warm

# Render's free tier spins the backend down after ~15 min idle; this pings
# /ping and pre-warms the execution-desk radar caches on a schedule. Lives in
# this public repo so the minutes are free (see refresh-cache.yml). No secrets
# needed. GitHub cron is best-effort — the three offset lines are independent
# schedule events, so more chances to fire.

on:
  schedule:
    - cron: '*/7 * * * *'
    - cron: '2-59/7 * * * *'
    - cron: '5-59/7 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Warm execution-desk radar caches
        continue-on-error: true
        run: |
          for path in options/radar longterm/radar "swing/radar?universe=prime"; do
            curl -s -o /dev/null -w "warm $path → %{http_code} in %{time_total}s\n" \
              --max-time 120 "https://alphaforgeresearch.onrender.com/$path" || true
          done
      - name: Ping /ping
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://alphaforgeresearch.onrender.com/ping || echo "000")
            echo "attempt $i → HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "backend did not return 200 after 3 tries (may be a cold boot in progress)"
      - name: Warm zero-cost execution snapshot
        run: |
          curl --fail --silent --show-error --max-time 90 \
            'https://alphaforgeresearch.onrender.com/swing/radar?universe=prime' \
            > /dev/null
